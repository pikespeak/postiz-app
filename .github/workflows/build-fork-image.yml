---
name: "Build Fork Image"

# Builds the arm64 image of this fork for the self-hosted instance.
# Upstream images are built by build-containers.yml under ghcr.io/gitroomhq.

on:
  workflow_dispatch:

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/postiz-app
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.dev \
            -t $IMAGE:main \
            -t $IMAGE:$SHORT_SHA \
            --build-arg NEXT_PUBLIC_VERSION=fork-$SHORT_SHA \
            --pull \
            --provenance=false --sbom=false \
            --push .
